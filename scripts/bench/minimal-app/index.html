<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Electron floor</title>
    <style>
      body {
        margin: 0;
        background: #17242d;
        color: #ddd;
        font: 14px sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
    </style>

    <style>
      .rec {
        position: fixed;
        right: 20px;
        bottom: 12px;
        width: 30px;
        height: 30px;
        border-radius: 100%;
        border: none;
        background: #fc3e3f;
        color: #fff;
        font-size: 10px;
      }
      .rec.active {
        animation: pulse 2.5s linear infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 2px 0 rgba(252, 62, 63, 0.6);
        }
        70% {
          box-shadow: 0 0 2px 4px rgba(252, 62, 63, 0.6);
        }
        100% {
          box-shadow: 0 0 2px 4px rgba(252, 62, 63, 0);
        }
      }
    </style>
    <script>
      if (location.search.includes('pulse')) {
        const b = document.createElement('button');
        b.className = 'rec active';
        b.textContent = 'REC';
        document.addEventListener('DOMContentLoaded', () => document.body.appendChild(b));
      }
    </script>
  </head>
  <body>
    <div>Static page — Electron memory floor (docs/rework)</div>
  </body>
</html>
