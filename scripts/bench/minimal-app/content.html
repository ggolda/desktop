<!doctype html>
<html><head><meta charset="utf-8"><title>Electron floor (content)</title>
<style>
body{margin:0;height:100vh;overflow:hidden;font:13px sans-serif;color:#cfd8dc;
  background:linear-gradient(135deg,#17242D 0%,#1f3340 50%,#17242D 100%)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px}
.card{background:linear-gradient(#22343f,#1b2a33);border-radius:6px;padding:8px;height:120px;box-shadow:0 1px 3px #0008}
</style>
<style>
.rec{position:fixed;right:20px;bottom:12px;width:30px;height:30px;border-radius:100%;border:none;background:#fc3e3f;color:#fff;font-size:10px}
.rec.active{animation:pulse 2.5s linear infinite}
@keyframes pulse{0%{box-shadow:0 0 2px 0 rgba(252,62,63,.6)}70%{box-shadow:0 0 2px 4px rgba(252,62,63,.6)}100%{box-shadow:0 0 2px 4px rgba(252,62,63,0)}}
</style>
<script>if(location.search.includes('pulse')){const b=document.createElement('button');b.className='rec active';b.textContent='REC';document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(b));}</script>
</head><body><div class="grid" id="g"></div>
<script>
const g=document.getElementById('g');
for(let i=0;i<48;i++){const d=document.createElement('div');d.className='card';d.textContent=('Scene item '+i+' — lorem ipsum dolor sit amet ').repeat(4);g.appendChild(d);}
</script></body></html>
