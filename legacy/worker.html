<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'unsafe-hashes' slbundle: 'sha256-wLcQqK3hC0mVyCtHmjyXOGmZGEWzdtE8WVZ8QazbBCI=' 'sha256-LvV9X60R0/ujDMWZrGm2zH4upC7BKHNh2a60+Ne3Xrc='">
    <script>
      global = globalThis;

      if (window.location.search.match('worker')) {
        let handlerHasRun = false;

        window['_startupErrorHandler'] = event => {
          if (handlerHasRun) return;
          handlerHasRun = true;

          const electron = require('electron');
          electron.ipcRenderer.send('startupError', event && event.message || 'Script load error');
        }

        window.addEventListener('error', window['_startupErrorHandler']);
      }
    </script>
    <script defer src="slbundle://bundles/worker.js"  onerror="window['_startupErrorHandler'] && window['_startupErrorHandler']()"></script>
  </head>
  <body></body>
</html>
